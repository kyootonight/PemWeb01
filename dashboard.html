<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Creator Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navbar, link-nya dijejer pakai float: left di style.css -->
  <div class="navbar clearfix">
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="profile.html">Profil Saya</a>
    <a href="login.html">Keluar</a>
  </div>

  <div class="page-content">
    <h2>Halo, Kyotoo</h2>
    <p class="subtitle">Ini ringkasan aktivitas kamu hari ini</p>

    <!-- 3 kotak statistik, dijejer pakai float di style.css -->
    <div class="clearfix">
      <div class="stat-box">
        <div class="stat-label">Total Konten</div>
        <div class="stat-value">24</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Pengikut</div>
        <div class="stat-value">1204</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Views Bulan Ini</div>
        <div class="stat-value">8500</div>
      </div>
    </div>

    <div class="card">
      <h3>Aktivitas Terbaru</h3>

      <div class="activity-item clearfix">
        <span class="activity-time">2 jam lalu</span>
        Kamu memperbarui foto profil
      </div>
      <div class="activity-item clearfix">
        <span class="activity-time">Kemarin</span>
        Konten "Belajar CSS Dasar" diunggah
      </div>
      <div class="activity-item clearfix">
        <span class="activity-time">3 hari lalu</span>
        Bio profil diperbarui
      </div>
    </div>
  </div>

</body>
</html>
